services:
  postgres:
    image: postgres:16
    container_name: expense-postgres
    environment:
      POSTGRES_USER: expense_user
      POSTGRES_PASSWORD: expense_pass
      POSTGRES_DB: expense_tracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense_user -d expense_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  rest-server:
    build: .
    container_name: expense-rest-server
    ports:
      - "8080:8080"
    environment:
      # DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL: postgres://expense_user:expense_pass@postgres:5432/expense_tracker
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS}
      REFRESH_TTL_DAYS: ${REFRESH_TTL_DAYS}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
